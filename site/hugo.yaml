baseURL: "/"
languageCode: "zh-cn"
title: "Nhà máy kịch ngắn Jellyfish AI"
defaultContentLanguage: "zh"
hasCJKLanguage: true
enableRobotsTXT: true

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

outputs:
  home:
    - HTML
    - RSS
  page:
    - HTML
  section:
    - HTML
    - RSS

menu:
  main:
    - name: Trang chủ
      pageRef: /
      weight: 1
    - name: Sản phẩm
      pageRef: /product
      weight: 2
    - name: Tài liệu
      pageRef: /docs
      weight: 3
    - name: Blog
      pageRef: /blog
      weight: 4
    - name: GitHub
      url: "https://github.com/Forget-C/Jellyfish"
      weight: 5
      params:
        icon: github

params:
  description: "nền tảng sản xuất short drama AI trọn gói từ kịch bản đến phân cảnh, tài nguyên, sinh video và dựng."
  keywords:
    - AIkịch ngắn
    - Nhà máy phim ngắn AI
    - Sản xuất kịch ngắn
    - Chỉnh sửa phân cảnh
    - Tạo video AI
    - Jellyfish
  images:
    - /images/og-default.svg
  search:
    enable: false
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg
      link: /
      width: 40
      height: 40
    width: wide
  page:
    width: wide
  footer:
    displayCopyright: true
    displayPoweredBy: false
    width: wide
  theme:
    default: system
    displayToggle: true
  social:
    github: "https://github.com/Forget-C/Jellyfish"
    x: "@ForgetCTeam"
