hero:
  title: "Nhà máy kịch ngắn Jellyfish AI"
  subtitle: "Không gian làm việc AI cho sản xuất phim ngắn, từ phân tách kịch bản đến phân cảnh, tài nguyên, tạo và dựng, hoàn tất tại một chỗ."
  primary:
    text: "Xem tài liệu"
    link: "/docs/"
  secondary:
    text: "Truy cập GitHub"
    link: "https://github.com/Forget-C/Jellyfish"

features:
  - title: "Quản lý nhất quán tài nguyên"
    description: "thống nhất nhân vật, bối cảnh, đạo cụ và trang phục, giảm trôi dạt phong cách trong sinh AI."
  - title: "Quy trình sáng tác công nghiệp hóa"
    description: "từ xử lý kịch bản, chỉnh sửa phân cảnh đến sinh tác vụ và dựng, hình thành workflow hoàn chỉnh."
  - title: "Kiểm soát chi tiết cấp phân cảnh"
    description: "hỗ trợ chỉnh sửa chi tiết cấp độ thấp về ngôn ngữ điện ảnh, thoại, ảnh khung, prompt và tài nguyên liên kết."
  - title: "Đa mô hình và Agent phối hợp"
    description: "quản lý thống nhất mô hình của các nhà cung cấp khác nhau, và dùng workflow Agent để tiếp nhận năng lực AI."

scenarios:
  - eyebrow: "Studio"
    title: "Studio phim AI"
    description: "phù hợp biến nhân vật, bối cảnh, shot và quy trình sinh thành tài nguyên sản xuất có thể tái dùng của team."
  - eyebrow: "Creator"
    title: "Người sáng tạo nội dung kịch bản ngắn"
    description: "phù hợp với người cần tổ chức kịch bản, phân cảnh và chất liệu, thay vì chỉ sáng tạo bằng prompt rời rạc."
  - eyebrow: "Team"
    title: "Đội thương hiệu và nội dung"
    description: "phù hợp công cụ hóa quy trình sản xuất video truyện, giảm ngắt thông tin khi nhiều người cộng tác."
  - eyebrow: "Lab"
    title: "Xác thực sản phẩm AI"
    description: "phù hợp với team muốn kiểm chứng nhanh workflow short drama, dàn dựng Agent và năng lực nối mô hình."

highlights:
  - label: "Trục chính bàn làm việc"
    value: "Dự án → Chương → Phân cảnh"
  - label: "Khả năng phía sau"
    value: "FastAPI + LangChain / LangGraph"
  - label: "Phối hợp phía trước"
    value: "React + Vite + tạo từ OpenAPI"
  - label: "Triển khai cục bộ"
    value: "Compose khởi động frontend, backend, MySQL, RustFS"

workflow:
  title: "Quy trình sản xuất kịch ngắn một trạm"
  steps:
    - "Đầu vào kịch bản"
    - "Tối ưu và tách kịch bản"
    - "Trích xuất nhân vật, bối cảnh, đạo cụ"
    - "Tạo và chỉnh sửa phân cảnh"
    - "Tạo tác vụ hình ảnh / video"
    - "Cắt ghép và xuất trên trục thời gian"

screenshots:
  title: "Xem trước giao diện chính"
  items:
    - title: "Tổng quan dự án"
      image: "/images/screenshots/project.png"
      alt: "Tổng quan dự án Jellyfish"
    - title: "Quản lý tài nguyên"
      image: "/images/screenshots/assets.png"
      alt: "Quản lý tài nguyên Jellyfish"

cta:
  title: "Từ mã nguồn đến tài liệu, dựng sẵn một lần"
  description: "Xem hướng dẫn nhanh, hướng dẫn triển khai và tài liệu cấu trúc dự án để đi vào quy trình phát triển và sử dụng Jellyfish một cách nhanh chóng."
  primary:
    text: "Bắt đầu đọc"
    link: "/docs/getting-started/local-dev/"
  secondary:
    text: "Triển khai Docker"
    link: "/docs/getting-started/docker/"

quickstart:
  title: "Bắt đầu nhanh"
  command: "cp deploy/compose/.env.example deploy/compose/.env && docker compose --env-file deploy/compose/.env -f deploy/compose/docker-compose.yml up --build"
  note: "nếu bạn thiên về điều phối local, cũng có thể khởi động riêng `backend/` và `front/`."
