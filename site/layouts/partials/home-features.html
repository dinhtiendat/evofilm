{{ $features := site.Data.homepage.features }}
<section class="jf-section">
  <div class="jf-heading">
    <div class="jf-kicker">Capabilities</div>
    <h2>Năng lực cốt lõi</h2>
    <p class="jf-lead">Dọc quanh một vài điểm đau quan trọng nhất của sản xuất phim ngắn AI, ưu tiên xây dựng tính nhất quán, quy trình hóa và tính kiểm soát được.</p>
  </div>
  <div class="jf-feature-grid">
    {{ range $features }}
      <div class="jf-feature jf-card">
        <h3>{{ .title }}</h3>
        <p class="jf-card-copy">{{ .description }}</p>
      </div>
    {{ end }}
  </div>
</section>
