{{ $shots := site.Data.homepage.screenshots }}
<section class="jf-section">
  <div class="jf-heading">
    <div class="jf-kicker">Screens</div>
    <h2>{{ $shots.title }}</h2>
    <p class="jf-lead">Hiện tại trước tiên tái sử dụng ảnh chụp màn hình có sẵn trong kho, sau đó có thể tiếp tục bổ sung giao diện bàn làm việc chương, chỉnh sửa phân cảnh và quản lý mô hình.</p>
  </div>
  <div class="jf-screenshot-grid">
    {{ range $shots.items }}
      <figure class="jf-shot">
        <img src="{{ .image }}" alt="{{ .alt }}">
        <figcaption>{{ .title }}</figcaption>
      </figure>
    {{ end }}
  </div>
</section>
