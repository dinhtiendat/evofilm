{{ $tocHTML := .TableOfContents }}
{{ if and $tocHTML (ne (trim $tocHTML " \n\r\t") "") }}
  <nav class="jf-static-toc" aria-label="Table of contents">
    <div class="jf-static-toc-inner">
      <p class="jf-static-toc-title">Trên trang này</p>
      {{ $tocHTML | safeHTML }}
    </div>
  </nav>
{{ end }}
